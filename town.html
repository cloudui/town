/* Layout: one full-bleed pixel scene; the UI floats over it as small signs. Day = golden hour, night = neon. */
:root {
  --page: #fbe8c5;
  --panel: #fff8ea;
  --ink: #3a2b26;
  --muted: #7a6559;
  --edge: #3a2b26;
  --shadow: rgba(58, 43, 38, .22);
  --accent: #b3424f;
  --chip: #f6dcc0;
  --scrim: rgba(58, 43, 38, .35);

  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #060918; --panel: #10133a; --ink: #eef0ff; --muted: #a3a9da; --edge: #ff4fa3;
    --shadow: rgba(63, 240, 255, .35); --accent: #3ff0ff; --chip: #1d2052; --scrim: rgba(3, 4, 14, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #060918; --panel: #10133a; --ink: #eef0ff; --muted: #a3a9da; --edge: #ff4fa3;
  --shadow: rgba(63, 240, 255, .35); --accent: #3ff0ff; --chip: #1d2052; --scrim: rgba(3, 4, 14, .6);
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 var(--body); overflow: hidden; }
#app { position: relative; height: 100%; }

#scroller { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
#scroller::-webkit-scrollbar { display: none; }
#stage { position: relative; }
#town { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }

.spot { position: absolute; display: block; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.spot:focus { outline: none; }
.spot:focus-visible { outline: 2px dashed var(--accent); outline-offset: 3px; }

.pix { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 2px var(--edge), 4px 4px 0 2px var(--shadow); }

#tag { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); padding: 5px 10px 6px; white-space: nowrap; text-align: center; font-family: var(--pixel); font-size: 15px; line-height: 1.2; }
#tag small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); }

.hud { position: absolute; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }
.hud.top { top: 0; align-items: flex-start; padding-block: 16px 0; }
.hud.bottom { bottom: 0; align-items: flex-end; padding-block: 0 16px; }

.plate { padding: 8px 12px 9px; min-width: 0; }
.plate h1 { margin: 0; font: 600 20px/1.1 var(--pixel); letter-spacing: .02em; }
.plate p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

.pbtn { font: 600 15px/1 var(--pixel); color: var(--ink); background: var(--panel); border: 0; padding: 9px 12px 10px; cursor: pointer;
  box-shadow: 0 0 0 2px var(--edge), 3px 3px 0 2px var(--shadow); display: inline-flex; align-items: center; gap: 8px; }
.pbtn:hover { transform: translate(-1px, -1px); box-shadow: 0 0 0 2px var(--edge), 4px 4px 0 2px var(--shadow); }
.pbtn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 2px var(--edge), 1px 1px 0 2px var(--shadow); }
.pbtn:focus-visible { outline: 2px dashed var(--accent); outline-offset: 4px; }
.pbtn svg { width: 16px; height: 16px; shape-rendering: crispEdges; }

.hint { font-family: var(--pixel); font-size: 13px; padding: 6px 10px; color: var(--muted); }

#panel { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--scrim);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.card { position: relative; width: 100%; max-width: 32rem; max-height: 82vh; overflow: auto; padding: 22px 24px 24px; }
.card h2 { margin: 0 64px 10px 0; font: 700 26px/1.15 var(--pixel); text-wrap: balance; }
.card h3 { margin: 0; font: 600 17px/1.25 var(--pixel); }
.card p { margin: 0 0 12px; max-width: 62ch; }
.card a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.card .close { position: absolute; top: 14px; right: 14px; padding: 7px 9px 8px; font-size: 13px; }
.lede { color: var(--ink); }
.muted { color: var(--muted); font-size: 14px; }
.list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 14px; }
.list li { padding: 12px 14px; background: var(--chip); }
.list .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 10px; margin-bottom: 6px; }
.list p { margin: 0 0 8px; font-size: 15px; }
.chip { font: 600 12px/1 var(--pixel); padding: 5px 7px; background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--edge); font-variant-numeric: tabular-nums; }
.dir { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.dir li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--muted); }
.dir li:last-child { border-bottom: 0; }
.dir button { font: 600 16px/1.2 var(--pixel); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.dir a { font-family: var(--pixel); font-size: 16px; }
.dir span { color: var(--muted); font-size: 14px; text-align: right; }
.mailrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 6px 0 8px; }
.mailrow code { font: 600 15px/1.4 ui-monospace, "SF Mono", Menlo, monospace; padding: 8px 10px; background: var(--chip); user-select: all; min-width: 0; overflow-wrap: anywhere; }

@media (max-width: 520px) {
  .plate h1 { font-size: 18px; }
  .plate p { font-size: 12px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pbtn:hover, .pbtn:active { transform: none; }
}

<template id="t-work">
  <h2 id="panel-title">Kernel works</h2>
  <p class="lede">I write GPU kernels and work on LLM inference. Before this I was a machine learning engineer at Meta, working on ranking for Facebook Reels.</p>
  <ul class="list">
    <li>
      <div class="head"><h3>Llama 3.1 8B inference engine</h3><span class="chip">97% of bandwidth floor</span></div>
      <p>Written in Triton. It runs at 97% of the memory-bandwidth floor and keeps pace with vLLM from batch 1 to 128.</p>
      <a href="https://github.com/cloudui" target="_blank" rel="noopener">Code on GitHub →</a>
    </li>
    <li>
      <div class="head"><h3>FlashAttention-2 in CuTe</h3><span class="chip">Walkthrough</span></div>
      <p>A step-by-step build of FlashAttention-2 using CUTLASS's CuTe layouts.</p>
      <a href="https://blog.echen.io" target="_blank" rel="noopener">Read it on the blog →</a>
    </li>
  </ul>
</template>

<template id="t-writing">
  <h2 id="panel-title">Library</h2>
  <p>I write about behavior, emotions, relationships, and how I think about life. Lately, also about GPU kernels.</p>
  <a href="https://blog.echen.io" target="_blank" rel="noopener">Visit the blog at blog.echen.io →</a>
</template>

<template id="t-photos">
  <h2 id="panel-title">Photo booth</h2>
  <p>Photos of cities, food, and whatever catches my eye. A proper gallery is being built. For now the prints are on Instagram.</p>
  <a href="https://instagram.com/violeric" target="_blank" rel="noopener">@violeric on Instagram →</a>
</template>

<template id="t-about">
  <h2 id="panel-title">Ice cream stand</h2>
  <p>Hi, I'm Eric. I live in San Francisco and studied computer engineering at the University of Maryland.</p>
  <p>I'm into photography, books, cities, good food, and cats. This town is still being built, so expect new buildings.</p>
</template>

<template id="t-contact">
  <h2 id="panel-title">Mailbox</h2>

  for (const sp of SPOTS) {
    const el = spotEls[sp.id];
    el.style.left = (ox + sp.x) * S + "px"; el.style.top = (oy + sp.y) * S + "px";
    el.style.width = sp.w * S + "px"; el.style.height = sp.h * S + "px";
  }
  build();
  if (mode === "night") armNeon(-1e9);
  placeTag();
  document.getElementById("hint").textContent = touchMQ.matches
    ? (scrollMode ? "Swipe to look around. Tap a place, tap again to go in." : "Tap a place, tap again to go in.")
    : "Hover around town. Click a place to go in.";
}

// ---------- hover labels ----------
function setHover(id) { hover = id; placeTag(); }
function placeTag() {
  const sp = SPOTS.find(s => s.id === hover);
  if (!sp) { tagEl.hidden = true; return; }
  const sub = sp.pet && pets ? `Petted ${pets} ${pets === 1 ? "time" : "times"}` : sp.s;
  tagEl.innerHTML = `${sp.t}<small>${sub}</small>`;
  tagEl.style.left = (ox + sp.x + sp.w / 2) * S + "px";
  tagEl.style.top = (oy + sp.y) * S + "px";
  tagEl.hidden = false;
}

// ---------- hotspots ----------
let lastPT = "mouse", armed = false;
for (const sp of SPOTS) {
  const el = document.createElement(sp.href ? "a" : "button");
  el.className = "spot";
  if (sp.href) { el.href = sp.href; el.target = "_blank"; el.rel = "noopener"; } else el.type = "button";
  el.setAttribute("aria-label", `${sp.t}: ${sp.s}`);
  el.addEventListener("pointerdown", e => { lastPT = e.pointerType; armed = hover === sp.id; });
  el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") setHover(sp.id); });
  el.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && hover === sp.id) setHover(null); });
  el.addEventListener("focus", () => setHover(sp.id));
  el.addEventListener("blur", () => { if (hover === sp.id && lastPT !== "touch") setHover(null); });
  el.addEventListener("click", e => {
    if (lastPT === "touch" && !armed && !sp.pet) { e.preventDefault(); setHover(sp.id); armed = true; return; }
    lastPT = "mouse";
    if (sp.pet) { pets++; const now = performance.now(); hearts.push({x: ox + 228 + (Math.random() * 4 | 0), y: oy + 99, t0: now}); setHover(sp.id); return; }
    if (sp.panel) openPanel(sp.panel, el);
  });
  stage.appendChild(el);
  spotEls[sp.id] = el;
}
stage.addEventListener("pointerdown", e => { if (!e.target.closest(".spot")) setHover(null); });

// ---------- panels ----------
const panel = document.getElementById("panel"), panelBody = document.getElementById("panel-body");
let returnFocus = null;
function openPanel(id, from) {
  const tpl = document.getElementById("t-" + id);
  if (!tpl) return;
  if (panel.hidden) returnFocus = from || document.activeElement;
  panelBody.replaceChildren(tpl.content.cloneNode(true));
  panel.hidden = false;
  document.getElementById("panel-close").focus();
}
function closePanel() { panel.hidden = true; if (returnFocus && returnFocus.focus) returnFocus.focus(); returnFocus = null; }
document.getElementById("panel-close").addEventListener("click", closePanel);
panel.addEventListener("click", e => {
  if (e.target === panel) return closePanel();
  const open = e.target.closest("[data-open]");
  if (open) return openPanel(open.dataset.open);
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    const el = document.getElementById(copy.dataset.copy), msg = document.getElementById("copied");
    const fallback = () => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); if (msg) { msg.textContent = "Selected. Press Ctrl+C or ⌘C to copy."; msg.hidden = false; } };
    try {
      navigator.clipboard.writeText(el.textContent.trim()).then(() => { if (msg) { msg.textContent = "Copied to your clipboard."; msg.hidden = false; } }, fallback);
    } catch (_) { fallback(); }
  }
});
addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) closePanel(); });
document.getElementById("dir-btn").addEventListener("click", e => openPanel("directory", e.currentTarget));

// ---------- day / night ----------
const modeBtn = document.getElementById("mode");
function paintToggle() {
  const night = mode === "night";
  document.getElementById("mode-label").textContent = night ? "Day" : "Night";
  modeBtn.setAttribute("aria-pressed", String(night));
  modeBtn.setAttribute("aria-label", night ? "Switch to day" : "Switch to night");
  const g = document.getElementById("mode-icon");
  const px = night
    ? [[3,0],[3,7],[0,3],[7,3],[1,1],[6,1],[1,6],[6,6],[2,2],[3,2],[4,2],[5,2],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[5,4],[2,5],[3,5],[4,5],[5,5]]
    : [[2,0],[3,0],[4,0],[1,1],[2,1],[0,2],[1,2],[0,3],[1,3],[0,4],[1,4],[0,5],[1,5],[2,5],[1,6],[2,6],[3,6],[4,6],[5,6],[2,7],[3,7],[4,7],[6,5]];
  g.innerHTML = px.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1"/>`).join("");
}
function applyMode(animate) {
  const m = currentMode();
  if (m === mode && bgC) return;
  if (animate && bgC && !reduceMQ.matches) { const snap = mk(W, Hs); snap.getContext("2d").drawImage(cv, 0, 0); fade = {cv: snap, t0: performance.now()}; }
  mode = m;
  build();
  if (mode === "night") armNeon(animate ? performance.now() + 250 : -1e9);
  paintToggle();
}
modeBtn.addEventListener("click", () => {
  root.setAttribute("data-theme", mode === "night" ? "light" : "dark");
  applyMode(true);
});
new MutationObserver(() => applyMode(true)).observe(root, {attributes: true, attributeFilter: ["data-theme"]});
darkMQ.addEventListener("change", () => applyMode(true));

// ---------- boot ----------
mode = currentMode();
paintToggle();
let rt = 0;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(layout, bgC ? 120 : 0); }).observe(scroller);
layout();
requestAnimationFrame(loop);
})();
</script>
